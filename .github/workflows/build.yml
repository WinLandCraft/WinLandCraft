name: build

on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_amd64
          - os: windows-latest
            platform: windows_amd64
          - os: macos-13
            platform: macos_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@1.97
      - name: Stage native engine
        if: runner.os != 'Windows'
        run: ./gradlew stageAdblockNative
      - name: Stage native engine on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat stageAdblockNative
      - uses: actions/upload-artifact@v4
        with:
          name: adblock-${{ matrix.platform }}
          path: build/generated/adblockNativeResources
          if-no-files-found: error

  package:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@1.97
      - uses: actions/download-artifact@v4
        with:
          pattern: adblock-*
          path: native-bundle
          merge-multiple: true
      - name: Check and build universal JAR
        run: ./gradlew clean check build -PadblockNativeBundleDir="$PWD/native-bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: winlandcraft
          path: build/libs/winlandcraft-*.jar
          if-no-files-found: error
