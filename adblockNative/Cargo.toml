[package]
name = "winlandcraft-adblock"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = "0.21.1"
serde_json = "1.0.145"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
