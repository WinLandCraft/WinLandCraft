plugins {
    id 'fabric-loom' version '1.9.2'
}

version = project.mod_version
group = 'dev.winlandcraft'

evaluationDependsOn(':mcefFork')
evaluationDependsOn(':adblockNative')
def modernMcef = project(':mcefFork').tasks.named('modernMcef')
def modernMcefJar = project(':mcefFork').layout.buildDirectory.file(
        "distributions/winlandcraft-mcef-${project.chromium_version}.jar")
def modernMcefFiles = files(modernMcefJar).builtBy(modernMcef)
def adblockBuild = project(':adblockNative').tasks.named('cargoBuild')
def adblockTarget = project(':adblockNative').layout.buildDirectory.dir('cargo-target/release')
def hostOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def hostArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def nativePlatform = hostOs.contains('win') ? 'windows' : hostOs.contains('mac') ? 'macos' : 'linux'
def nativeArch = ['amd64': 'amd64', 'x86_64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'][hostArch]
if (nativeArch == null) throw new GradleException("Unsupported adblock native architecture: ${hostArch}")
def adblockLibrary = nativePlatform == 'windows' ? 'winlandcraft_adblock.dll'
        : nativePlatform == 'macos' ? 'libwinlandcraft_adblock.dylib' : 'libwinlandcraft_adblock.so'
def stagedAdblock = layout.buildDirectory.dir('generated/adblockNativeResources')
def adblockNativeBundleDir = providers.gradleProperty('adblockNativeBundleDir')
def stageAdblockNative = tasks.register('stageAdblockNative', Sync) {
    dependsOn adblockBuild
    into(stagedAdblock)
    from(adblockTarget.map { it.file(adblockLibrary) }) {
        into "META-INF/natives/${nativePlatform}_${nativeArch}"
    }
    if (adblockNativeBundleDir.isPresent()) from(file(adblockNativeBundleDir.get()))
}

repositories {
    maven { url = 'https://mcef-download.cinemamod.com/repositories/releases' }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        winlandcraft {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation modernMcefFiles
}

def modVersion = version.toString()
processResources {
    dependsOn stageAdblockNative
    inputs.property 'version', modVersion
    inputs.property 'chromiumVersion', project.chromium_version
    filesMatching('fabric.mod.json') {
        expand version: modVersion, chromiumVersion: project.chromium_version
    }
    from(stagedAdblock)
}

jar {
    dependsOn modernMcef
    from(modernMcefJar) { into 'META-INF/jars' }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// Dependency-free geometry checks against the actual client window implementation.
sourceSets {
    geometryCheck {
        compileClasspath = sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}
tasks.register('verifyWindowGeometry', JavaExec) {
    dependsOn geometryCheckClasses
    // RenderSystem's queue check initializes LWJGL's allocator, but never creates a GL context.
    classpath = sourceSets.geometryCheck.runtimeClasspath + configurations.minecraftNatives
    mainClass = 'dev.winlandcraft.WindowGeometryChecks'
}
check.dependsOn verifyWindowGeometry
tasks.register('verifyScreenLighting', JavaExec) {
    dependsOn geometryCheckClasses
    classpath = sourceSets.geometryCheck.runtimeClasspath
    mainClass = 'dev.winlandcraft.ScreenLightingChecks'
}
check.dependsOn verifyScreenLighting
tasks.register('verifyStreaming', JavaExec) {
    dependsOn geometryCheckClasses
    classpath = sourceSets.geometryCheck.runtimeClasspath
    mainClass = 'dev.winlandcraft.StreamChecks'
}
check.dependsOn verifyStreaming
tasks.register('verifyFavicons', JavaExec) {
    dependsOn geometryCheckClasses
    classpath = sourceSets.geometryCheck.runtimeClasspath
    mainClass = 'dev.winlandcraft.FaviconChecks'
}
check.dependsOn verifyFavicons
tasks.register('verifyBrowserAddresses', JavaExec) {
    dependsOn geometryCheckClasses
    classpath = sourceSets.geometryCheck.runtimeClasspath
    mainClass = 'dev.winlandcraft.BrowserAddressChecks'
}
check.dependsOn verifyBrowserAddresses
tasks.register('verifyAdBlockNative', JavaExec) {
    dependsOn geometryCheckClasses, adblockBuild
    classpath = sourceSets.geometryCheck.runtimeClasspath
    mainClass = 'dev.winlandcraft.AdBlockNativeChecks'
    doFirst { args adblockTarget.get().file(adblockLibrary).asFile.absolutePath }
}
check.dependsOn verifyAdBlockNative
tasks.register('verifyWebApps', JavaExec) {
    dependsOn geometryCheckClasses
    classpath = sourceSets.geometryCheck.runtimeClasspath
    mainClass = 'dev.winlandcraft.WebAppChecks'
}
check.dependsOn verifyWebApps
tasks.register('verifyResourceCounters', JavaExec) {
    dependsOn geometryCheckClasses
    classpath = sourceSets.geometryCheck.runtimeClasspath
    mainClass = 'dev.winlandcraft.ResourceChecks'
}
tasks.register('smokeResourceCounters', JavaExec) {
    dependsOn geometryCheckClasses
    classpath = sourceSets.geometryCheck.runtimeClasspath
    mainClass = 'dev.winlandcraft.ResourceChecks'
    args '--live'
}
check.dependsOn verifyResourceCounters
check.dependsOn project(':adblockNative').tasks.named('cargoTest')

// Development launches can hide missing refmap declarations. Check the distributable JAR.
tasks.register('verifyMixinPackaging') {
    dependsOn remapJar
    doLast {
        def parser = new groovy.json.JsonSlurper()
        new java.util.zip.ZipFile(tasks.remapJar.archiveFile.get().asFile).withCloseable { zip ->
            def readJson = { String path ->
                def entry = zip.getEntry(path)
                if (entry == null) throw new GradleException("Missing packaged resource: ${path}")
                zip.getInputStream(entry).withCloseable { parser.parse(it) }
            }
            def mod = readJson('fabric.mod.json')
            def expected = [MouseHandlerMixin: ['onPress', 'onScroll'],
                            KeyboardHandlerMixin: ['keyPress', 'charTyped'],
                            GuiMixin: ['renderCrosshair'],
                            MinecraftMixin: ['startAttack', 'continueAttack', 'startUseItem'],
                            GameRendererLightMixin: ['renderLevel'],
                            ItemInHandRendererMixin: ['renderItem', 'renderHandsWithItems'],
                            ItemStackRenderStateMixin: ['render'],
                            ItemStackLayerRenderStateMixin: ['render']]
            if (!mod.mixins.contains('winlandcraft.client.mixins.json')) {
                throw new GradleException('Input mixin configuration is not registered')
            }
            def config = readJson('winlandcraft.client.mixins.json')
            if (!config.refmap) throw new GradleException('Input mixins have no refmap configured')
            def refmap = readJson(config.refmap)
            expected.each { mixin, methods ->
                if (!config.client.contains(mixin)) throw new GradleException("Missing mixin: ${mixin}")
                def className = config.package.replace('.', '/') + '/' + mixin
                if (zip.getEntry(className + '.class') == null) throw new GradleException("Missing class: ${className}")
                methods.each { method ->
                    def target = refmap.mappings[className]?.get(method)
                    if (!(target instanceof String) || !target.startsWith('Lnet/minecraft/class_')) {
                        throw new GradleException("Missing production mapping: ${className}.${method}")
                    }
                }
            }
            ['McefRuntimeMixin', 'McefChromiumFlagsMixin', 'McefPaintMixin'].each { mcefMixin ->
                if (!config.client.contains(mcefMixin)) throw new GradleException("Missing mixin: ${mcefMixin}")
                def mcefClass = config.package.replace('.', '/') + '/' + mcefMixin
                if (zip.getEntry(mcefClass + '.class') == null) throw new GradleException("Missing class: ${mcefClass}")
            }
            def nested = zip.entries().find { it.name.startsWith('META-INF/jars/winlandcraft-mcef-') && it.name.endsWith('.jar') }
            if (nested == null) throw new GradleException('Missing embedded Chromium 151 MCEF runtime')
            if (zip.getEntry('META-INF/ADBLOCK-NOTICE.txt') == null)
                throw new GradleException('Missing adblock third-party notice')
            def iconLicense = zip.getEntry('META-INF/PIXELARTICONS-LICENSE.txt')
            if (iconLicense == null) throw new GradleException('Missing Pixelarticons license')
            def licenseText = zip.getInputStream(iconLicense).withCloseable { it.getText('UTF-8') }
            if (!licenseText.contains('8275e0af7c16aa40c54ea2b90b7af83b1fe4eb4c') || !licenseText.contains('MIT License'))
                throw new GradleException('Pixelarticons provenance or license is incomplete')
            if (zip.getEntry('dev/winlandcraft/PixelIcon.class') == null)
                throw new GradleException('Missing PixelIcon runtime class')
            if (zip.getEntry('assets/winlandcraft/shaderpacks/screen_lights.glsl') == null)
                throw new GradleException('Missing bundled Solas screen-light shader')
            ['items/laser_pointer.json', 'models/item/laser_pointer.json'].each { asset ->
                if (zip.getEntry("assets/winlandcraft/${asset}") == null)
                    throw new GradleException("Missing Laser Pointer asset: ${asset}")
            }
            def laserModel = readJson('assets/winlandcraft/models/item/laser_pointer.json')
            def sensor = laserModel.elements.find { element ->
                element.from[2] == 0 && (element.from[0] + element.to[0]) / 2 == 8
                        && (element.from[1] + element.to[1]) / 2 == 8 && element.faces.north.texture == '#dark'
            }
            if (sensor == null) throw new GradleException('Laser Pointer sensor must remain centered at (8, 8, 0)')
            def iconEntry = zip.getEntry('assets/winlandcraft/textures/gui/pixelarticons.png')
            if (iconEntry == null) throw new GradleException('Missing Pixelarticons atlas')
            zip.getInputStream(iconEntry).withCloseable { stream ->
                def atlas = javax.imageio.ImageIO.read(stream)
                if (atlas == null || atlas.width != 192 || atlas.height != 72)
                    throw new GradleException('Pixelarticons atlas must be 192x72')
                for (int row = 0; row < 3; row++) for (int column = 0; column < 8; column++) {
                    boolean visible = false
                    for (int y = row * 24; y < (row + 1) * 24 && !visible; y++)
                        for (int x = column * 24; x < (column + 1) * 24; x++)
                            if ((atlas.getRGB(x, y) >>> 24) != 0) { visible = true; break }
                    if (!visible) throw new GradleException("Pixelarticons atlas cell ${column},${row} is empty")
                }
            }
            def expectedNatives = adblockNativeBundleDir.isPresent() ? [
                    'META-INF/natives/linux_amd64/libwinlandcraft_adblock.so',
                    'META-INF/natives/windows_amd64/winlandcraft_adblock.dll',
                    'META-INF/natives/macos_amd64/libwinlandcraft_adblock.dylib']
                    : ["META-INF/natives/${nativePlatform}_${nativeArch}/${adblockLibrary}"]
            expectedNatives.each { nativePath ->
                if (zip.getEntry(nativePath) == null)
                    throw new GradleException("Missing native adblock engine: ${nativePath}")
            }
            logger.lifecycle('Packaged mixins, Chromium runtime, Pixelarticons atlas/license, and native adblock engine verified.')
        }
    }
}
check.dependsOn verifyMixinPackaging
